<?xml version="1.0" encoding="UTF-8"?>
<!-- Companion icon for Hana (cooperative practice / collective work), built to match the
     official brand icon construction: solid brand-color circle, thin darker ring, dark line art.
     Motif: lauhala weave. Colors: Parchment #d3bdab / Shadow #442f16. Replace with the official icon if one is made. -->
<svg id="Icons" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 237.31 237.16">
  <defs>
    <style>
      .cls-1 { fill: #d3bdab; }
      .cls-2 { fill: none; stroke: #442f16; stroke-width: 5.6; stroke-linecap: round; stroke-linejoin: round; }
      .cls-3 { fill: none; stroke: #442f16; stroke-width: 2.6; }
    </style>
  </defs>
  <g id="Hana" data-name="Hana">
    <circle class="cls-1" cx="118.66" cy="118.58" r="118.5"/>
    <circle class="cls-3" cx="118.66" cy="118.58" r="113.2"/>
    <!-- woven lattice: two families of diagonals forming a 3x3 weave -->
    <path class="cls-2" d="M62,118.6 L118.6,62"/>
    <path class="cls-2" d="M80.9,137.5 L137.5,80.9"/>
    <path class="cls-2" d="M99.7,156.3 L156.3,99.7"/>
    <path class="cls-2" d="M118.6,175.2 L175.2,118.6"/>
    <path class="cls-2" d="M118.6,62 L175.2,118.6"/>
    <path class="cls-2" d="M99.7,80.9 L156.3,137.5"/>
    <path class="cls-2" d="M80.9,99.7 L137.5,156.3"/>
    <path class="cls-2" d="M62,118.6 L118.6,175.2"/>
  </g>
</svg>
